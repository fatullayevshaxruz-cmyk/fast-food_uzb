<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Yetkazib berish manzilini tanlang</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #map { width: 100%; height: 100%; }
    .overlay-card {
      position: absolute;
      bottom: 20px;
      left: 15px;
      right: 15px;
      background: white;
      padding: 16px;
      border-radius: 14px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      z-index: 1000;
    }
    .address-title { font-size: 13px; color: #888; margin-bottom: 4px; text-transform: uppercase; font-weight: 600; }
    .address-text { font-size: 15px; font-weight: 600; color: #222; margin-bottom: 12px; min-height: 20px; }
    .confirm-btn {
      width: 100%;
      background: #2481cc;
      color: white;
      border: none;
      padding: 12px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
    }
    .confirm-btn:disabled { background: #b0c4de; cursor: not-allowed; }
    .center-pin {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -100%);
      z-index: 1000;
      pointer-events: none;
      font-size: 36px;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="center-pin">📍</div>
  <div class="overlay-card">
    <div class="address-title">Tanlangan manzil:</div>
    <div id="addressText" class="address-text">Xaritadan joyni belgilang...</div>
    <button id="confirmBtn" class="confirm-btn" onclick="sendLocation()">Manzilni tasdiqlash</button>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.expand(); }

    const initialLat = 41.311081;
    const initialLon = 69.240562;

    const map = L.map('map').setView([initialLat, initialLon], 14);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    let selectedLat = initialLat;
    let selectedLon = initialLon;
    let selectedAddress = "Toshkent shahri";

    async function fetchAddress(lat, lon) {
      document.getElementById('addressText').innerText = "Manzil aniqlanmoqda...";
      try {
        const resp = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}`);
        const data = await resp.json();
        selectedAddress = data.display_name.split(',').slice(0, 3).join(',') || "Toshkent";
      } catch (e) {
        selectedAddress = "Belgilangan nuqta";
      }
      document.getElementById('addressText').innerText = selectedAddress;
    }

    map.on('moveend', function() {
      const center = map.getCenter();
      selectedLat = center.lat;
      selectedLon = center.lng;
      fetchAddress(selectedLat, selectedLon);
    });

    // Foydalanuvchining joriy lokatsiyasini so'rash
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition((pos) => {
        map.setView([pos.coords.latitude, pos.coords.longitude], 16);
      });
    }

    function sendLocation() {
      const payload = {
        lat: selectedLat,
        lon: selectedLon,
        address: selectedAddress
      };
      if (tg) {
        tg.sendData(JSON.stringify(payload));
      } else {
        alert("Lokatsiya: " + JSON.stringify(payload));
      }
    }
  </script>
</body>
</html>
