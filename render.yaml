services:
  - type: web
    name: fastfood-bot-webapp
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: cd fastfood_bot && python3 bot.py
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.14
      - key: PORT
        value: 8080
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: ADMIN_CHANNEL_ID
        sync: false
      - key: BRANCH_1_CHANNEL_ID
        sync: false
      - key: DELIVERY_CHANNEL_ID
        sync: false
      - key: WEB_APP_URL
        sync: false
      - key: RENDER_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: WORKING_HOURS_START
        value: "9"
      - key: WORKING_HOURS_END
        value: "23"
      - key: MIN_ORDER_AMOUNT
        value: "30000"
      - key: DELIVERY_FEE
        value: "10000"
